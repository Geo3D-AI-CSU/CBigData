# CBigData — GeoServer Docker 部署
#
# 用法:
#   docker compose up -d          # 启动 GeoServer（后台运行）
#   docker compose down           # 停止并删除容器
#   docker compose logs -f        # 查看日志
#   docker compose down -v        # 停止并删除数据卷（⚠️ 会清空所有已发布的图层）
#
# GeoServer 管理面板:
#   http://localhost:8080/geoserver
#   用户名: admin
#   密码:   geoserver

services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    container_name: cbigdata-geoserver
    ports:
      - "8080:8080"
    environment:
      # 管理员凭据
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      # 启用 CORS（允许前端 :8081 + 后端 :3002 跨域访问 WMS）
      - CORS_ENABLED=true
      # 跨域请求不检查 CSRF token
      - CSRF_DISABLED=true
      # Java 内存限制
      - JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      # GeoServer 数据目录（持久化 — 所有已发布的图层、样式、工作区都存这里）
      - geoserver_data:/opt/geoserver/data_dir
      # 将后端 GeoTIFF 缓存目录挂载到容器内（GeoServer 可直接读取）
      - ./backend/cache/geotiff:/opt/geoserver/data_dir/data/hunan:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/geoserver/rest/about/version.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  geoserver_data:
    name: cbigdata-geoserver-data
