# CBigData — 全栈 Docker 部署
#
# 服务:
#   geoserver (8080) — GeoServer WMS 地图服务
#   postgres  (5432) — PostgreSQL 数据库 (认证 + 卫星数据)
#   backend   (3000, 3002) — Node.js 数据服务 + 认证服务
#
# 用法:
#   docker compose up -d              # 启动所有服务
#   docker compose down               # 停止并删除容器
#   docker compose logs -f backend    # 查看后端日志
#   docker compose down -v            # 停止并删除所有数据卷 (⚠️ 会清空数据库和图层)
#
# 管理面板:
#   GeoServer:  http://localhost:8080/geoserver  (admin / geoserver)
#   PostgreSQL: localhost:5432                    (postgres / 123456)

services:
  # ============================================================
  # GeoServer — WMS 地图服务
  # ============================================================
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    container_name: cbigdata-geoserver
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - CORS_ENABLED=true
      - CSRF_DISABLED=true
      - JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./backend/cache/geotiff:/opt/geoserver/data_dir/data/hunan:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/geoserver/rest/about/version.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # PostgreSQL — 数据库服务 (用户认证 + OCO-2/GEDI 卫星数据)
  # ============================================================
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: cbigdata-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Backend — Node.js 数据服务 (3002) + 认证服务 (3000)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cbigdata-backend
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      # 数据库连接 (指向 postgres 服务)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_NAME=postgres
      # 后端配置
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 挂载 GeoTIFF 缓存目录 (与 GeoServer 共享)
      - backend_cache:/app/cache
      # GEE 凭据 (如需使用 GEE 数据源)
      - ./backend/gee-service-account.json:/app/gee-service-account.json:ro
    restart: unless-stopped

volumes:
  geoserver_data:
    name: cbigdata-geoserver-data
  postgres_data:
    name: cbigdata-postgres-data
  backend_cache:
    name: cbigdata-backend-cache
